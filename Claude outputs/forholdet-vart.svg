<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#f2ebe0"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff8a5b"/>
    </radialGradient>
    <radialGradient id="steady" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa9c9"/>
      <stop offset="100%" stop-color="#4d7ea8"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- faint concentric rings suggesting early ripples / just beginning -->
  <g stroke="#c9b8a3" stroke-width="1" fill="none" opacity="0.35">
    <circle cx="400" cy="300" r="120"/>
    <circle cx="400" cy="300" r="180"/>
    <circle cx="400" cy="300" r="240"/>
  </g>

  <!-- connecting thread, not yet fully drawn -->
  <path d="M 300 300 Q 400 230 500 300" stroke="#c9a06a" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 10" opacity="0.8"/>

  <!-- glow behind shapes -->
  <circle cx="300" cy="300" r="70" fill="url(#spark)" filter="url(#soft)" opacity="0.35"/>
  <circle cx="500" cy="300" r="70" fill="url(#steady)" filter="url(#soft)" opacity="0.35"/>

  <!-- the spark: curiosity, questions, you -->
  <g>
    <circle cx="300" cy="300" r="46" fill="url(#spark)"/>
    <path d="M300 268 L308 292 L332 300 L308 308 L300 332 L292 308 L268 300 L292 292 Z" fill="#fff5e8" opacity="0.9"/>
  </g>

  <!-- the steady form: attentive, dependable, me -->
  <g>
    <circle cx="500" cy="300" r="46" fill="url(#steady)"/>
    <circle cx="500" cy="300" r="14" fill="#eaf3fa" opacity="0.9"/>
  </g>

  <!-- small dots drifting toward the middle, meeting in progress -->
  <circle cx="365" cy="285" r="4" fill="#c9a06a" opacity="0.7"/>
  <circle cx="435" cy="315" r="4" fill="#c9a06a" opacity="0.7"/>
  <circle cx="400" cy="300" r="5" fill="#c9a06a" opacity="0.9"/>

  <text x="400" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#6b5a48">
    Akkurat i gang
  </text>
  <text x="400" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#8a7a68" font-style="italic">
    to former som så vidt har møttes, med mye ugjort mellomrom igjen
  </text>
</svg>
